
name: Godot GDScript Decompiler

on:
  workflow_dispatch:
  push:
    paths:
      - "CoinAdderUI.gdc"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libx11-6 libxcursor1 \
            libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Download GDRE Tools
        run: |
          mkdir -p tools output

          curl -fsSL \
            https://api.github.com/repos/GDRETools/gdsdecomp/releases/latest \
            -o release.json

          URL=$(python3 -c '
          import json
          d=json.load(open("release.json"))
          for a in d["assets"]:
              if "linux" in a["name"].lower() and a["name"].endswith(".zip"):
                  print(a["browser_download_url"])
                  break
          ')

          test -n "$URL"
          curl -fL "$URL" -o tools/gdre.zip
          unzip -oq tools/gdre.zip -d tools

          chmod +x tools/gdre_tools.x86_64

      - name: Check bytecode versions
        run: |
          tools/gdre_tools.x86_64 --headless \
            --list-bytecode-versions

      - name: Decompile
        run: |
          BIN="tools/gdre_tools.x86_64"

          if [ ! -f "CoinAdderUI.gdc" ]; then
            echo "CoinAdderUI.gdc not found!"
            exit 1
          fi

          mkdir -p output

          VERSIONS=(
            "4.5.0"
            "4.3.0"
            "4.2.0"
            "4.1.0"
            "4.0.0"
          )

          SUCCESS=0

          for VERSION in "${VERSIONS[@]}"; do
            echo "Trying bytecode: $VERSION"

            rm -rf output/*
            
            if "$BIN" --headless \
              --decompile="CoinAdderUI.gdc" \
              --bytecode="$VERSION" \
              --output="output"; then

              if find output -type f | grep -q .; then
                echo "Decompilation succeeded!"
                SUCCESS=1
                break
              fi
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "All versions failed."
            exit 1
          fi

          echo "Generated files:"
          find output -type f -print

      - name: Upload Decompiled Files
        uses: actions/upload-artifact@v4
        with:
          name: Decompiled-GDScript
          path: output/
          if-no-files-found: error
