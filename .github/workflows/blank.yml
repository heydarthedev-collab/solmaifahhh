
name: Godot GDC Decompiler

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Download GDRE Tools
        shell: bash
        run: |
          mkdir -p tools output

          curl -fsSL \
            https://api.github.com/repos/GDRETools/gdsdecomp/releases/latest \
            -o release.json

          URL=$(python3 -c '
          import json
          d=json.load(open("release.json"))
          for a in d["assets"]:
              n=a["name"].lower()
              if "linux" in n and n.endswith(".zip"):
                  print(a["browser_download_url"])
                  break
          ')

          if [ -z "$URL" ]; then
            echo "Linux ZIP not found"
            exit 1
          fi

          echo "Downloading: $URL"
          curl -fL "$URL" -o tools/gdre.zip
          unzip -q tools/gdre.zip -d tools

          find tools -maxdepth 3 -type f

      - name: Find GDRE executable
        shell: bash
        run: |
          BIN=$(find tools -type f \
            \( -name 'gdre_tools*' -o -name 'GDRE_Tools*' \) \
            | head -n 1)

          if [ -z "$BIN" ]; then
            echo "GDRE executable not found"
            exit 1
          fi

          chmod +x "$BIN"
          echo "GDRE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Decompile CoinAdderUI
        shell: bash
        run: |
          "$GDRE_BIN" --headless \
            --decompile=CoinAdderUI.gdc \
            --output=output

          echo "Decompiled files:"
          find output -type f -print

          if ! find output -type f -name 'CoinAdderUI.gd' | grep -q .; then
            echo "CoinAdderUI.gd was not generated"
            exit 1
          fi

      - name: Upload source code
        uses: actions/upload-artifact@v4
        with:
          name: CoinAdderUI-Decompiled
          path: output/
          if-no-files-found: error
