
name: Godot GDC Decompiler

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Download GDRE
        run: |
          mkdir -p tools output

          curl -fsSL https://api.github.com/repos/GDRETools/gdsdecomp/releases/latest -o release.json

          URL=$(python3 -c '
          import json
          d=json.load(open("release.json"))
          for a in d["assets"]:
              if "linux" in a["name"].lower() and a["name"].endswith(".zip"):
                  print(a["browser_download_url"])
                  break
          ')

          test -n "$URL"
          curl -fL "$URL" -o tools/gdre.zip
          unzip -q tools/gdre.zip -d tools

      - name: Locate executable
        run: |
          BIN=$(find tools -type f -name 'gdre_tools' -perm /111 | head -n 1)

          if [ -z "$BIN" ]; then
            BIN=$(find tools -type f -name 'GDRE_Tools' -perm /111 | head -n 1)
          fi

          if [ -z "$BIN" ]; then
            echo "Executable not found!"
            find tools -type f
            exit 1
          fi

          echo "Found executable: $BIN"
          chmod +x "$BIN"
          echo "GDRE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Check GDRE
        run: |
          file "$GDRE_BIN"
          "$GDRE_BIN" --headless --list-bytecode-versions

      - name: Decompile
        run: |
          test -f CoinAdderUI.gdc

          "$GDRE_BIN" --headless \
            --decompile=CoinAdderUI.gdc \
            --output=output

          find output -type f -print

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: CoinAdderUI-Decompiled
          path: output/
          if-no-files-found: error
